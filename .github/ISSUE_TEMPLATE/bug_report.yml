name: Bug report
description: The plugin, the build or a widget does not work.
labels: [bug]
body:
  - type: input
    id: sdk
    attributes:
      label: Expo SDK version
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: Plugin options from your app config
      render: json
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The prebuild output, the Gradle error, or what the widget does on the device and which Android version.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
